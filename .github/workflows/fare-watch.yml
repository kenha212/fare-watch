name: Fare Watch

on:
  schedule:
    # Every 4 hours
    - cron: "0 */4 * * *"
  workflow_dispatch: {}

jobs:
  check-fares:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python fare_watch.py
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}

      - name: Commit updated price history and digest state
        run: |
          git config user.name "fare-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add price_history.json digest_state.json
          git commit -m "Update fare history" || echo "No changes to commit"
          git push
